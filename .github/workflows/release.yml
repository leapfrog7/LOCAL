name: Publish signed Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test -- --run
      - run: npm run build
      - run: npm run android:sync
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.LOCAL_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/LOCAL-release.jks"
          chmod 600 "$RUNNER_TEMP/LOCAL-release.jks"
      - name: Build minified signed APK and AAB
        working-directory: android
        env:
          LOCAL_RELEASE_STORE_FILE: ${{ runner.temp }}/LOCAL-release.jks
          LOCAL_RELEASE_STORE_PASSWORD: ${{ secrets.LOCAL_RELEASE_STORE_PASSWORD }}
          LOCAL_RELEASE_KEY_ALIAS: ${{ secrets.LOCAL_RELEASE_KEY_ALIAS }}
          LOCAL_RELEASE_KEY_PASSWORD: ${{ secrets.LOCAL_RELEASE_KEY_PASSWORD }}
          LOCAL_VERSION_CODE: ${{ vars.LOCAL_VERSION_CODE }}
        run: ./gradlew lintRelease testReleaseUnitTest assembleRelease bundleRelease
      - name: Verify and name artifacts
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          test "$VERSION" = "$(node -p "require('./package.json').version")"
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" && test -f "$AAB"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release-artifacts
          cp "$APK" "release-artifacts/LOCAL-$VERSION.apk"
          cp "$APK" release-artifacts/LOCAL-latest.apk
          cp "$AAB" "release-artifacts/LOCAL-$VERSION.aab"
          (cd release-artifacts && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG_NAME" release-artifacts/* --repo "$GITHUB_REPOSITORY" --title "LOCAL ${TAG_NAME#v}" --notes-file "RELEASE_NOTES_${TAG_NAME#v}.md" --verify-tag
